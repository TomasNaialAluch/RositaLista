<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosita Carnicería Premium - Lista de Precios</title>
<meta name="description" content="Lista de precios de Rosita Carnicería Premium. Calculá cuánto vas a gastar y hacé tu pedido por WhatsApp.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<!-- El CSS de cada componente vive en css/components/<misma-carpeta>/,
     un archivo por componente — mismo mapeo 1:1 que los <script> de abajo. -->
<link rel="stylesheet" href="css/components/chrome/header.css">
<link rel="stylesheet" href="css/components/chrome/intro.css">
<link rel="stylesheet" href="css/components/chrome/viewToggle.css">
<link rel="stylesheet" href="css/components/chrome/collapseToggle.css">
<link rel="stylesheet" href="css/components/chrome/footer.css">
<link rel="stylesheet" href="css/components/cart/cart.css">
<link rel="stylesheet" href="css/components/catalog/cards.css">
<link rel="stylesheet" href="css/components/catalog/productList.css">
<link rel="stylesheet" href="css/components/catalog/calcularAsado.css">
<link rel="stylesheet" href="css/components/nav/nav.css">
<link rel="stylesheet" href="css/components/nav/orbe.css">
</head>
<body>

<!-- index.html no tiene markup propio: cada pedazo de la página es un
     componente en js/components/ que crea su propio DOM al montarse (su
     CSS se importa arriba, no se inyecta más por JS). Este archivo solo
     importa scripts y estilos, en el orden que respeta sus dependencias;
     js/app.js es la raíz que arma todo el árbol, parecido a como un root
     component monta una app React. -->

<script src="js/components/icons.js"></script>
<script src="js/pricing.js"></script>
<script src="js/preparation.js"></script>
<script src="js/components/chrome/header.js"></script>
<script src="js/components/chrome/intro.js"></script>
<script src="js/components/chrome/viewToggle.js"></script>
<script src="js/components/chrome/collapseToggle.js"></script>
<script src="js/components/chrome/footer.js"></script>
<script src="js/components/cart/cartState.js"></script>
<script src="js/components/cart/swipeToClose.js"></script>
<script src="js/components/cart/splitModal.js"></script>
<script src="js/components/cart/cart.js"></script>
<script src="js/components/nav/nav.js"></script>
<script src="js/components/nav/orbe.js"></script>
<script src="js/components/catalog/cards.js"></script>
<script src="js/components/catalog/productList.js"></script>
<script src="js/components/catalog/calcularAsado.js"></script>
<script src="js/app.js"></script>
</body>
</html>
